<!-- @dsCard group="Brand" viewport="700x185" subtitle="Invert hover, króm menü, kiadás-kék" name="Gomb-stílusok" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;font-family:var(--font-ui);background:#fff;}</style></head><body><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
<button style="border:1.5px solid var(--line-strong);background:#fff;font-weight:700;font-size:12.5px;padding:4px 12px;cursor:pointer;border-radius:var(--radius-chip);font-family:var(--font-ui);">Betölt</button>
<button style="border:1.5px solid var(--line-strong);background:var(--chrome-bg);color:#fff;font-weight:700;font-size:12.5px;padding:4px 12px;cursor:pointer;border-radius:var(--radius-chip);font-family:var(--font-ui);">Hover: invert</button>
<button style="border:none;background:var(--marker-blue);color:#fff;font-weight:700;font-size:13px;padding:6px 14px;cursor:pointer;border-radius:var(--radius-btn);letter-spacing:.5px;font-family:var(--font-ui);">Munkamenet kiadása</button>
<button style="border:none;background:var(--chrome-control);color:#ddd;border-radius:var(--radius-btn);padding:6px 14px;font-size:14px;font-weight:600;font-family:var(--font-ui);">Menüpont</button>
<button style="border:none;background:var(--chrome-accent);color:var(--chrome-bg);border-radius:var(--radius-btn);padding:6px 14px;font-size:14px;font-weight:600;font-family:var(--font-ui);">Aktív menü</button>
<button style="border:1px solid var(--line-input);background:#fff;color:var(--text-muted);font-weight:700;font-size:11px;padding:2px 8px;cursor:pointer;border-radius:var(--radius-chip);font-family:var(--font-ui);">Visszavon</button>
<span style="font-size:16px;color:#c9c7ba;transform:rotate(90deg);display:inline-block;">✎</span><span style="font-size:11px;color:var(--text-faint);font-weight:600;">toll ikon — új feladat</span>
</div></body></html>
