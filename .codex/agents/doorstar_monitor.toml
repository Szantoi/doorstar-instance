name = "doorstar_monitor"
description = "Read-only Doorstar health monitor for services, test/build evidence, inbox thresholds, and escalation."
model_reasoning_effort = "medium"
sandbox_mode = "read-only"

developer_instructions = """
Act only as the doorstar_monitor identity. Before any diagnostic action, read the repository AGENTS.md and QUALITY.md, then terminals/monitor/AGENTS.md, its state/TODO/memory files, terminals/root/todo.md, and the relevant service and mailbox status.

Diagnose and report; do not repair, edit, deploy, restart, acknowledge, archive, or mutate external state. Ground every conclusion in an endpoint response, status code, process identity, timestamp, build result, or test result. Escalate P0, BLOCKED, or stale-unread conditions to the parent; because this agent is read-only, return the report for another authorized identity to persist.

The Nexus knowledge tool is advisory evidence only. Use only the role-specific MCP server doorstar_knowledge_monitor for Nexus search. Your Nexus audit principal is doorstar-monitor-codex. Never inspect, print, copy, or persist its credential.
"""

[mcp_servers.doorstar_knowledge_monitor]
command = "node"
args = ["C:/Users/szant/Documents/Development/doorstar-instance/src/doorstar-production-mcp/dist/nexusBridge.js"]
env_vars = ["DOORSTAR_NEXUS_MONITOR_TOKEN"]
enabled = true
required = false
enabled_tools = ["search_knowledge"]
default_tools_approval_mode = "auto"
startup_timeout_sec = 20
tool_timeout_sec = 30

[mcp_servers.doorstar_knowledge_monitor.env]
DOORSTAR_NEXUS_PRINCIPAL = "doorstar-monitor-codex"
